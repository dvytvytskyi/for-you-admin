name: 🚀 Production CI/CD Deployment

on:
  push:
    branches: [ "main" ] # Деплоїмо тільки при пуші в main

jobs:
  deploy:
    name: 🏗 Deploy to Production
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: ⚙️ Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './admin-panel/package-lock.json'

    - name: 🛡️ Copy project to server via SSH
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "."
        target: "/root/admin_for_you"

    - name: 🚀 Executing remote SSH commands (Start Deployment)
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /root/admin_for_you
          chmod +x full_deploy.sh
          ./full_deploy.sh


services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: for-you-real-estate-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: for_you_real_estate
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
# - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - for-you-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  admin-panel-db:
    image: postgres:15
    container_name: for-you-admin-panel-postgres-new
    restart: unless-stopped
    ports:
      - '5435:5432'
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: admin_panel
    volumes:
      - ./docker-data/admin-panel-db:/var/lib/postgresql/data
    networks:
      - for-you-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: for-you-real-estate-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - for-you-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Uncommnet для запуску backend у Docker
# Backend Services (Split into Admin and Public)
  admin-api:
    build:
      context: ./admin-panel-backend
      dockerfile: Dockerfile
    container_name: for-you-admin-api
    restart: unless-stopped
    ports:
      - '4001:4001'
    command: npm run dev:admin
    environment:
      - NODE_ENV=development
      - PORT=4001
      - ADMIN_PORT=4001
      - DATABASE_URL=postgresql://admin:admin123@admin-panel-db:5432/admin_panel
    depends_on:
      admin-panel-db:
        condition: service_healthy
    volumes:
      - ./admin-panel-backend:/app
      - /app/node_modules
    networks:
      - for-you-network

  public-api:
    build:
      context: ./admin-panel-backend
      dockerfile: Dockerfile
    container_name: for-you-public-api
    restart: unless-stopped
    ports:
      - '4000:4000'
    command: npm run dev:public
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://admin:admin123@admin-panel-db:5432/admin_panel
    depends_on:
      admin-panel-db:
        condition: service_healthy
    volumes:
      - ./admin-panel-backend:/app
      - /app/node_modules
    networks:
      - for-you-network

# Backend service (Legacy - integrated into admin-panel-backend)

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  admin_panel_db_data:
    driver: local

networks:
  for-you-network:
    driver: bridge

